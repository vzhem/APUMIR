[package]
name = "p2p-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
mqtt-secondary-observe = []

# Собираем как динамическую библиотеку для Android (.so файл)
[lib]
name = "p2p_core"
crate-type = ["cdylib", "staticlib"]

# ═══ Локальный генератор биндингов UniFFI ═══════════════════════════
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]

# ── UniFFI: автогенерация биндингов Rust → Kotlin ───────────────────
uniffi = { version = "0.28", features = ["build", "cli"] }

# ── Сеть QUIC ───────────────────────────────────────────────────────
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls",
    "aws-lc-rs"
]}

rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "logging",
    "std",
    "tls12"
]}

# Генерация самоподписанных TLS-сертификатов (для QUIC в MVP)
rcgen = "0.13"

# mDNS для обнаружения устройств в локальной сети
mdns-sd = "0.11"

# Для работы с сетевыми адресами
socket2 = "0.5"

# Определение локальных сетевых интерфейсов (для mDNS)
if-addrs = "0.13"

# STUN протокол (для NAT Traversal через ICE)
stun_codec = "0.3"
bytecodec = "0.4"

# ── Криптография ────────────────────────────────────────────────────
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek  = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# ── Сериализация ────────────────────────────────────────────────────
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# ── База данных ─────────────────────────────────────────────────────
rusqlite = { version = "0.31", features = ["bundled"] }

# ── Логирование ─────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# ── Async runtime ───────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Утилиты ─────────────────────────────────────────────────────────
once_cell  = "1"
thiserror  = "1"
uuid       = { version = "1", features = ["v4"] }
rumqttc = "0.25.1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[profile.release]
opt-level = 3
lto       = true
strip     = true
panic     = "abort"

[profile.dev]
opt-level = 0
debug     = true

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
