name: Android Build Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

# Temporary maintainer-only probe for a failed release build. It replicates the
# release compilation path and publishes the Gradle failure tail as annotations
# (which remain accessible even if raw Actions logs cannot be downloaded).
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build native core and Kotlin bindings
        run: |
          cargo install --locked cargo-ndk
          cd rust-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android-app/app/src/main/jniLibs build --release --features mqtt-dual-broker
          cargo run --manifest-path ../tools/uniffi-bindgen/Cargo.toml -- generate src/lib.udl --language kotlin --config uniffi.toml --out-dir ../android-app/app/src/main/java --no-format || true

      - name: Build and expose Gradle failure
        working-directory: ./android-app
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon > "$RUNNER_TEMP/gradle-build.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "Gradle release build succeeded."
            exit 0
          fi
          echo "Gradle failed with exit code $status; exporting last 100 lines as annotations."
          tail -n 100 "$RUNNER_TEMP/gradle-build.log" | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr '%' '_' | tr '\r\n' ' ')
            [ -n "$clean" ] && echo "::error title=Gradle build tail::$clean"
          done
          exit "$status"
