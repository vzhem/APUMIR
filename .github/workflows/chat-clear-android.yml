name: Chat clear Android storage tests

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-clear-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: x86_64-linux-android
      - name: Build x86_64 native core and Kotlin bindings
        working-directory: rust-core
        run: |
          cargo install --locked cargo-ndk
          cargo ndk -t x86_64 -o ../android-app/app/src/main/jniLibs build --release --features mqtt-dual-broker
          cargo run --manifest-path ../tools/uniffi-bindgen/Cargo.toml -- generate src/lib.udl --language kotlin --config uniffi.toml --out-dir ../android-app/app/src/main/java --no-format
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Run chat clear SQLite and Room tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android-app && chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.package=com.vladimir.messenger.data.chatclear
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-clear-android-report
          path: |
            android-app/app/build/reports/androidTests/connected
            android-app/app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
