name: Android storage and navigation tests

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chat-clear-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-report:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[inspect-android:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Manual workflow_dispatch is not available to the repository integration.
      # A numeric marker in a push can expose an earlier report without printing
      # signed artifact URLs; this is read-only and normally skipped.
      - name: Inspect earlier Android report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          RUN_ID="$(python3 -c 'import os,re; m=re.search(r"\[inspect-android:(\d+)\]",os.environ["REQUEST"]); assert m; print(m.group(1))')"
          gh run download "$RUN_ID" --name android-storage-navigation-reports --dir "$RUNNER_TEMP/previous-android"
          python3 - "$RUNNER_TEMP/previous-android" <<'PY'
          from pathlib import Path
          import re, sys
          paths = sorted(Path(sys.argv[1]).rglob('navigation-*.log'))
          assert paths, 'No saved navigation logs in the requested artifact'
          for path in paths:
              lines = path.read_text(errors='replace').splitlines()
              important = [line for line in lines if line.startswith('e: ')]
              tail = [line for line in lines[-80:] if not line.startswith('w: ')]
              text = '\n'.join(important[-30:] + tail[-45:])
              text = re.sub(r'https?://\S+', '<redacted-url>', text)
              for i in range(0, len(text), 3000):
                  part = text[i:i+3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=Previous {path.name} part {i//3000+1}::{part}')
          PY
  android-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: x86_64-linux-android
      - name: Build x86_64 native core and Kotlin bindings
        working-directory: rust-core
        run: |
          cargo install --locked cargo-ndk
          cargo ndk -t x86_64 -o ../android-app/app/src/main/jniLibs build --release --features mqtt-dual-broker
          cargo run --manifest-path ../tools/uniffi-bindgen/Cargo.toml -- generate src/lib.udl --language kotlin --config uniffi.toml --out-dir ../android-app/app/src/main/java --no-format
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Check emulator-report guards
        run: |
          python3 scripts/ci/test-android-navigation-results.py
          python3 scripts/ci/test-android-notification-results.py
          python3 scripts/ci/test-android-notification-runner.py
      # An intentionally fake Firebase project exercises the actual Gradle
      # plugin, resources and disabled SDK on the emulator without a token or
      # access to the owner's project.
      - name: Prepare offline Firebase configuration for emulator tests
        run: |
          set -euo pipefail
          python3 scripts/ci/install-firebase-client-config.py --fake
          echo "ORG_GRADLE_PROJECT_apuFirebaseClient=true" >> "$GITHUB_ENV"
      - name: Run storage and navigation tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/ci/run-android-navigation-tests.sh
      - name: Remove offline Firebase configuration
        if: always()
        run: rm -f android-app/app/google-services.json
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-storage-navigation-reports
          path: target/android-test-reports
          if-no-files-found: warn
