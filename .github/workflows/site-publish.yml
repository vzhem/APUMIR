name: Publish release to official site

# Официальный сайт (apu.clan.su) обновляется сам, когда релиз опубликован:
# владелец просил «выпускаем релиз с новыми файлами — они автоматически
# загружаются на сайт». Релиз у нас сначала черновик (draft), поэтому
# событие именно published: сайт получает только то, что владелец уже
# одобрил и выпустил для всех. Инструкция и секреты: docs/SITE_PUBLISHING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег уже опубликованного релиза (например, v11.74.482)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  publish-to-site:
    name: Upload release files to apu.clan.su
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out publishing scripts
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -e
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::Не задан тег релиза"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG (prerelease: ${IS_PRERELEASE:-false})"
          if [ "${IS_PRERELEASE:-false}" = "true" ]; then
            echo "::notice::Пререлиз на сайт не публикуем: сайт — только для стабильных версий."
            echo "SKIP=1" >> "$GITHUB_OUTPUT"
          fi

      # A manual dispatch must not silently downgrade the site, either.
      # Capture the exact stable Latest metadata before touching FTP.
      - name: Require the published Latest release
        if: steps.tag.outputs.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APU_RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          set -e
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > site-release.json
          PYTHONPATH=scripts/release python3 - <<'PY'
          import json, os
          from pathlib import Path
          from site_release_files import MAX_METADATA_BYTES, release_assets
          with Path('site-release.json').open('rb') as source:
              data = source.read(MAX_METADATA_BYTES + 1)
          if len(data) > MAX_METADATA_BYTES:
              raise ValueError('release metadata too large')
          release_assets(json.loads(data), os.environ['APU_RELEASE_TAG'])
          print('Published stable Latest matches the requested tag')
          PY

      - name: Download release assets
        if: steps.tag.outputs.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          set -e
          mkdir -p site-files
          gh release download "$TAG" --repo "${{ github.repository }}" --dir site-files
          ls -la site-files
          # Состав сайта фиксированный: APK и его сумма обязательны.
          test -f site-files/app-release.apk
          test -f site-files/SHA256SUMS.txt

      # Релизы до появления пакетов в сборке (например, v11.74.482) zip-ов
      # не содержат: собираем пакеты из самого APK релиза здесь же, чтобы
      # сайт получил полный набор файлов для любого опубликованного тега.
      - name: Build feature packs if the release predates them
        if: steps.tag.outputs.SKIP != '1'
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          set -e
          if [ -f site-files/feature-packs.json ] && ls site-files/feature-pack-*.zip >/dev/null 2>&1; then
            echo "release already carries feature packs"
            exit 0
          fi
          echo "release predates feature packs - building them from its APK"
          python3 scripts/release/make-feature-packs.py site-files/app-release.apk site-files "$TAG"
          ls site-files/feature-pack-*.zip

      - name: Build site sidecar latest.json
        if: steps.tag.outputs.SKIP != '1'
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          set -e
          SHA="$(awk '$2 == "app-release.apk" {print $1}' site-files/SHA256SUMS.txt)"
          if [ -z "$SHA" ]; then
            echo "::error::SHA256SUMS.txt без app-release.apk — sidecar не строим"
            exit 1
          fi
          python3 - "$TAG" "$SHA" <<'PY'
          import json, sys
          payload = {"version": sys.argv[1], "sha256": sys.argv[2]}
          with open("site-files/latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(payload)
          PY

      # Система REST-передач кусками (≤100 МБ, пауза 5 минут) обязана быть
      # рабочей, а не «готовой на бумаге»: каждый запуск публикации сначала
      # прогоняет её против локального приёмника (нарезка, паузы,
      # продолжение, сборка обратно). Падение здесь = красный процесс.
      - name: Chunked transfer self-test (100 MB system)
        if: steps.tag.outputs.SKIP != '1'
        run: python3 scripts/release/chunked_upload.py --self-test

      - name: Test safe staged publication offline
        if: steps.tag.outputs.SKIP != '1'
        run: python3 scripts/release/test_site_staged_upload.py

      # Главный канал сайта: uCoz FTP, каталог /downloads. Каждый файл
      # сначала загружается под временным именем; публичное имя меняется
      # только после проверки размера, а latest.json — последним. Это не
      # атомарная замена всего набора; клиенты должны проверять хеши.
      # Уборка главной папки FTP: первый блин положил файлы релиза в корень
      # вместо /downloads. Скрипт удаляет только известные имена файлов
      # релиза (двойники); чужие файлы не трогает.
      - name: Clean misplaced files in FTP root
        if: steps.tag.outputs.SKIP != '1'
        env:
          APU_FTP_HOST: ${{ secrets.APU_UCOZ_FTP_HOST }}
          APU_FTP_USER: ${{ secrets.APU_UCOZ_FTP_USER }}
          APU_FTP_PASSWORD: ${{ secrets.APU_UCOZ_FTP_PASSWORD }}
        run: |
          if [ -z "$APU_FTP_HOST" ] || [ -z "$APU_FTP_USER" ] || [ -z "$APU_FTP_PASSWORD" ]; then
            echo "::notice::Секреты FTP не заданы — уборка корня пропущена."
            exit 0
          fi
          python3 scripts/release/ftp_cleanup.py

      - name: Upload to apu.clan.su via FTP
        if: steps.tag.outputs.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APU_RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
          APU_FTP_HOST: ${{ secrets.APU_UCOZ_FTP_HOST }}
          APU_FTP_USER: ${{ secrets.APU_UCOZ_FTP_USER }}
          APU_FTP_PASSWORD: ${{ secrets.APU_UCOZ_FTP_PASSWORD }}
          APU_FTP_REMOTE_DIR: ${{ vars.APU_UCOZ_FTP_REMOTE_DIR }}
        run: |
          # Отсутствующие секреты, незавершённый STOR, неизвестный размер или
          # отказ RNTO — ошибка, а не зелёная фикция обновлённого сайта.
          python3 scripts/release/site_staged_upload.py

      - name: Verify actual public site bytes
        if: steps.tag.outputs.SKIP != '1'
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APU_RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
        run: python3 scripts/release/site_verify_http.py

      # Система REST-передач большими кусками (по требованию владельца):
      # любой файл больше 100 МБ уходит на REST-приёмник кусками не больше
      # 100 МБ с паузой 5 минут между кусками. Сейчас таких файлов среди
      # пакетов нет, но система работает и ждёт свой адрес: включится,
      # когда владелец задаст APU_UPLOAD_REST_BASE (docs/SITE_PUBLISHING.md).
      - name: Chunked REST transfer for files over 100 MB
        if: steps.tag.outputs.SKIP != '1'
        env:
          REST_BASE: ${{ secrets.APU_UPLOAD_REST_BASE }}
          APU_UPLOAD_TOKEN: ${{ secrets.APU_UPLOAD_TOKEN }}
          APU_UPLOAD_DELAY_SECONDS: "300"
        run: |
          if [ -z "$REST_BASE" ]; then
            echo "::notice::APU_UPLOAD_REST_BASE не задан — REST-канал кусками выключен (система готова: scripts/release/chunked_upload.py)."
            exit 0
          fi
          set -e
          for file in site-files/*; do
            size=$(stat -c %s "$file")
            if [ "$size" -gt 104857600 ]; then
              echo "REST кусками: $file ($size Б)"
              python3 scripts/release/chunked_upload.py --base "$REST_BASE" "$file"
            fi
          done

      - name: Summary
        if: always() && steps.tag.outputs.SKIP != '1'
        run: |
          {
            echo "## Сайт apu.clan.su — публикация ${{ steps.tag.outputs.TAG }}"
            echo
            echo "Файлы релиза скачаны из GitHub Release и подготовлены в site-files/."
            echo "Загрузка на сайт — шаги выше: FTP (главный канал) и REST кусками (если настроен)."
            echo "Проверка после прогона: https://apu.clan.su/downloads/feature-packs.json"
          } >> "$GITHUB_STEP_SUMMARY"
