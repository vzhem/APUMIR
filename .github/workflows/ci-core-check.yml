name: Core compile check

# Проверка ядра на каждом pull request и по кнопке (workflow_dispatch).
#
# Зачем. Ни у владельца, ни в песочнице Arena нет Rust-тулчейна: раньше
# ошибка компиляции в rust-core находилась только на теге - то есть уже
# после того, как релиз собран и (при плохом раскладе) опубликован. Здесь
# тот же компилятор и та же линия фич, что в build-release.yml, но без NDK,
# без APK и без публикации: собирается только `cargo check`.
#
# Это ничего не публикует и не трогает релизы: релиз по-прежнему запускает
# только пуш тега vX.Y.Z (build-release.yml).
#
# Почему отчёт пишется в комментарий к pull request: хосты с логами прогона
# (results-receiver.actions.githubusercontent.com) недоступны из песочницы
# Arena, а комментарий читается обычным API. Владелец видит ту же ошибку
# прямо в pull request, без скачивания логов.
on:
  pull_request:
    paths:
      - 'rust-core/**'
      - 'tools/uniffi-bindgen/**'
      - 'scripts/ci/**'
      - '.github/workflows/ci-core-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check + uniffi contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Нативные зависимости ядра (aws-lc-rs, rusqlite bundled) собираются
      # на хосте: свой C-компилятор, cmake и openssl нужны им.
      - name: System packages for native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev cmake clang nasm

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Versions (for the report)
        run: |
          rustc --version
          cargo --version
          nproc

      # Та же линия фич, что и в релизе (build-release.yml): иначе проверка
      # компилировала бы не то, что собирается в APK. Вывод пишем в файл -
      # из него собирается отчёт в pull request.
      - name: cargo check (release, mqtt-dual-broker)
        working-directory: ./rust-core
        run: |
          set -o pipefail
          cargo check --release --features mqtt-dual-broker 2>&1 | tee ../target/ci-check.log

      # lib.udl должен собираться генератором: если он сломан, CI тега
      # оставит устаревший мост и старый .so - это ломает приложение на
      # старте по контрольным суммам. Пишем во временный каталог, ничего в
      # репозитории не меняя. Команда - ровно та же, что в build-release.yml
      # на теге, только каталог вывода другой.
      - name: uniffi bindings from lib.udl (Kotlin)
        working-directory: ./rust-core
        run: |
          set -o pipefail
          {
            mkdir -p ../target/uniffi-check
            cargo run --manifest-path ../tools/uniffi-bindgen/Cargo.toml -- \
              generate src/lib.udl --language kotlin --config uniffi.toml \
              --out-dir ../target/uniffi-check --no-format
            BIND=$(find ../target/uniffi-check -name p2p_core.kt | head -1)
            test -n "$BIND"
            test -s "$BIND"
            grep -q "ffi_p2p_core_uniffi_contract_version" "$BIND"
            echo "bindings: $BIND ($(wc -c < "$BIND") bytes)"
            # Версия контракта зависит только от линии uniffi. Если она уехала
            # относительно файла в git, то на теге останется старый мост с новым
            # .so - приложение упадёт на старте. Это предупреждение, а не
            # остановка: перегенерировать файл негде, это делает CI на теге.
            NEWV=$(grep -o 'bindings_contract_version = [0-9]*' "$BIND" | grep -o '[0-9]*$')
            OLDV=$(grep -o 'bindings_contract_version = [0-9]*' ../android-app/app/src/main/java/uniffi/p2p_core/p2p_core.kt | grep -o '[0-9]*$')
            echo "contract version: in git = $OLDV, generated = $NEWV"
            if [ "$NEWV" != "$OLDV" ]; then
              echo "::warning::uniffi line changed ($OLDV -> $NEWV): the tag build would keep the bindings from git - regenerate before the release"
            fi
          } 2>&1 | tee -a ../target/ci-check.log

      # Тесты ядра (K6 в плане): пока отдельным шагом и не блокирующим,
      # чтобы сначала набрать статистику. Падать от них релиз не должен.
      - name: cargo test (lib, non-blocking)
        working-directory: ./rust-core
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --release --features mqtt-dual-broker --lib 2>&1 | tee -a ../target/ci-check.log

      # Хвост вывода прямо на странице прогона: владельцу не нужно
      # скачивать лог, чтобы увидеть ошибку.
      - name: Show the tail of the output
        if: failure()
        run: tail -c 4000 target/ci-check.log || true

      # И тот же хвост - комментарием к pull request: из песочницы Arena
      # логи прогона не скачиваются, а комментарий читается через API.
      - name: Report the failure into the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=target/ci-check.log
          {
            echo "Проверка ядра не прошла (прогон ${GITHUB_RUN_ID}). Последние 4000 символов вывода:"
            echo
            echo '```'
            if [ -f "$LOG" ]; then tail -c 4000 "$LOG"; else echo "log file not found: $LOG"; fi
            echo '```'
          } > /tmp/report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/report.md
