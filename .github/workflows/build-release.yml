name: Build Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Подмена versionName в build.gradle.kts на имя тега
        run: |
          sed -i "s/versionName = \"v[0-9.]*\"/versionName = \"${{ steps.get_version.outputs.VERSION }}\"/" android-app/app/build.gradle.kts
          echo "versionName заменён на ${{ steps.get_version.outputs.VERSION }}"
          grep versionName android-app/app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x ./android-app/gradlew
      
      - name: Build Debug APK (auto-signed)
        working-directory: ./android-app
        run: ./gradlew :app:assembleRelease --no-daemon
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/release/app-release.apk
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## P2P Messenger ${{ steps.get_version.outputs.VERSION }}
            
            Автоматическая сборка из тега.
            
            ### Установка
            1. Скачайте app-debug.apk
            2. Разрешите установку из неизвестных источников
            3. Установите
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
