name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  # Поддерживаемый ручной прогон для диагностики сборки из ветки.
  # Публикация в нём ниже явно запрещена.
  workflow_dispatch:

permissions:
  contents: write

# Один тег иногда порождает ДВА запуска (GitHub дважды доставляет событие
# push тега - так было с v11.70.2). Группа concurrency ставит второй запуск
# в очередь; когда первый опубликует релиз, второй увидит его в job `check`
# и не станет собирать заново. cancel-in-progress выключен нарочно: обрывать
# первый запуск на середине сборки нельзя.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Skip auto-build if Release already exists
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check_release.outputs.exists }}
    steps:
      - name: Check if Release already exists for the tag
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "${{ github.repository }}" --json name >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release '$TAG' already exists — skipping auto-build to preserve the manually published release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existing release for '$TAG' — will auto-build."
          fi

  build:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The lineage gate below must be able to walk back to the last stable tag.
          fetch-depth: 0

      # Prevent a tag from rebuilding a branch that silently forked before the
      # latest public release (the v330-from-v206 failure mode). Compare with
      # GitHub's latest published stable release, not `main`, which may lag.
      - name: Require ancestry from the latest stable release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ -z "$CURRENT_TAG" || -z "$LATEST_TAG" ]]; then
            echo "::error::Could not identify current tag and latest published stable release"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${LATEST_TAG}^{commit}" >/dev/null; then
            echo "::error::Latest stable tag $LATEST_TAG is missing from the full checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${LATEST_TAG}^{commit}" "$GITHUB_SHA"; then
            echo "::error::Release tag $CURRENT_TAG does not descend from latest stable $LATEST_TAG; refusing a disconnected release line"
            exit 1
          fi
          echo "::notice::Release tag $CURRENT_TAG descends from latest stable $LATEST_TAG"
          {
            echo "### Release lineage and source delta"
            echo "- Candidate tag: $CURRENT_TAG"
            echo "- Latest published stable baseline: $LATEST_TAG"
            echo "- Baseline-to-candidate diff:"
            echo '```text'
            git diff --shortstat "refs/tags/${LATEST_TAG}^{commit}" "$GITHUB_SHA"
            git diff --name-status "refs/tags/${LATEST_TAG}^{commit}" "$GITHUB_SHA" > "$RUNNER_TEMP/release-paths.txt"
            sed -n '1,200p' "$RUNNER_TEMP/release-paths.txt"
            PATH_COUNT="$(wc -l < "$RUNNER_TEMP/release-paths.txt")"
            if [[ "$PATH_COUNT" -gt 200 ]]; then
              echo "... $((PATH_COUNT - 200)) more changed paths omitted"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check helper and diagnostics source contracts
        run: |
          python3 scripts/ci/check-online-helper.py
          python3 scripts/ci/check-diagnostics-report.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Пакета «tools» (старые SDK Tools) в репозитории Google больше нет;
          # значение по умолчанию «tools platform-tools» валит шаг (2026-09-15).
          packages: platform-tools

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android NDK and export ANDROID_NDK_HOME
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # Gate changes to online helper routing before cross-compilation/publication.
      # Includes a real four-endpoint QUIC race with a lost primary receipt.
      - name: Test online helper routing and direct transport
        working-directory: ./rust-core
        run: |
          set -o pipefail
          for suite in helper_policy helper_quality helper_delivery peer_assistance peer_exchange direct_transport mqtt_fanout; do
            LOG="$RUNNER_TEMP/helper-$suite.log"
            if ! RUST_LOG=warn CARGO_TERM_COLOR=never cargo test --release --features mqtt-dual-broker --lib "network::$suite::tests" > "$LOG" 2>&1; then
              tail -150 "$LOG"
              python3 - "$LOG" <<'PY'
          from pathlib import Path
          import sys
          text = "\n".join(Path(sys.argv[1]).read_text(errors="replace").splitlines()[-150:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          # Compiler warnings can exceed one annotation's size; preserve final diagnostics.
          for i in range(0, len(text), 3000):
              print(f"::error title=Helper routing tests part {i // 3000 + 1}::{text[i:i + 3000]}")
          PY
              exit 1
            fi
            tail -25 "$LOG"
            grep '^test result:' "$LOG" >> "$GITHUB_STEP_SUMMARY"
          done
          # STUN fallback is pure/deterministic; don't depend on public DNS or live servers.
          for test in stun_fallback_uses_next_endpoint_after_a_temporary_refusal all_stun_refusals_return_a_recoverable_error_after_all_attempts; do
            LOG="$RUNNER_TEMP/stun-$test.log"
            if ! RUST_LOG=warn CARGO_TERM_COLOR=never cargo test --release --features mqtt-dual-broker --lib "network::ice::tests::$test" > "$LOG" 2>&1; then
              tail -150 "$LOG"
              exit 1
            fi
            tail -25 "$LOG"
            grep '^test result:' "$LOG" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Build native core from source (all ABIs)
        working-directory: ./rust-core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android-app/app/src/main/jniLibs build --release --features mqtt-dual-broker

      # ---- мост Kotlin <-> ядро ----------------------------------------------
      # android-app/app/src/main/java/uniffi/p2p_core/p2p_core.kt порождается из
      # rust-core/src/lib.udl генератором uniffi-bindgen. Раньше файл лежал в git
      # «как есть», и любая новая функция ядра требовала генератора на ПК
      # разработчика (его нет ни у владельца, ни у бота) - ядро было заморожено.
      # Теперь генератор собирается здесь (tools/uniffi-bindgen, uniffi =0.28.3 -
      # та же линия 0.28, что у ядра) и переписывает файл перед сборкой APK.
      # Ошибка генерации блокирует APK: старый мост может не совпасть с новым ядром.
      - name: Regenerate uniffi Kotlin bindings from lib.udl
        working-directory: ./rust-core
        run: |
          BIND=../android-app/app/src/main/java/uniffi/p2p_core/p2p_core.kt
          ok=0
          if cargo run --manifest-path ../tools/uniffi-bindgen/Cargo.toml -- \
               generate src/lib.udl --language kotlin --config uniffi.toml \
               --out-dir ../android-app/app/src/main/java --no-format; then
            if grep -q "ffi_p2p_core_uniffi_contract_version" "$BIND"; then ok=1; fi
          fi
          if [ "$ok" = 1 ]; then
            # Страховка: генератор и ядро должны быть одной линии uniffi
            # (0.28 → contract 26). Иначе приложение упадёт на старте.
            NEWV=$(grep -o 'bindings_contract_version = [0-9]*' "$BIND" | grep -o '[0-9]*$')
            OLDV=$(git show HEAD:android-app/app/src/main/java/uniffi/p2p_core/p2p_core.kt | grep -o 'bindings_contract_version = [0-9]*' | grep -o '[0-9]*$')
            if [ "$NEWV" != "$OLDV" ]; then
              ok=0
              echo "::error::uniffi contract version changed ($OLDV -> $NEWV): generator and core must use the same contract"
            fi
          fi
          if [ "$ok" = 1 ]; then
            echo "::notice::uniffi bindings regenerated from lib.udl, sha256 $(sha256sum "$BIND" | cut -c1-16)"
            if git diff --quiet -- "$BIND"; then
              echo "uniffi bindings match the committed file"
            else
              echo "::notice::regenerated uniffi bindings differ from git - they will be pushed back to main after the release"
              git diff --stat -- "$BIND"
            fi
          else
            echo "::error::uniffi-bindgen failed; refusing an APK with stale bindings"
            exit 1
          fi

      # Native bridge/core snapshot for debugging this run.
      - name: Upload core bindings (debug aid)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: core-bindings
          path: |
            android-app/app/src/main/java/uniffi/p2p_core/p2p_core.kt
            android-app/app/src/main/jniLibs/arm64-v8a/libp2p_core.so
            android-app/app/src/main/jniLibs/armeabi-v7a/libp2p_core.so
          retention-days: 30

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Sync versionName with tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "Setting versionName to $VERSION"
            sed -i "s|versionName = .*|versionName = \"$VERSION\"|" android-app/app/build.gradle.kts
          else
            echo "::notice::workflow_dispatch is not a tag build; leaving the Gradle diagnostic versionName unchanged"
          fi
          grep -n "versionName" android-app/app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x ./android-app/gradlew

      - name: Test story chunks and diagnostics report
        working-directory: ./android-app
        run: |
          set +e
          ./gradlew :app:testReleaseUnitTest \
            --tests com.vladimir.messenger.data.swarm.ContentAddressedChunksTest \
            --tests com.vladimir.messenger.data.story.StoryPhotoPartsTest \
            --tests com.vladimir.messenger.data.diagnostics.DiagnosticsReportTest \
            --no-daemon > "$RUNNER_TEMP/gradle-release.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/gradle-release.log"
          exit "$status"

      - name: Build Release APK
        working-directory: ./android-app
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon > "$RUNNER_TEMP/gradle-release.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/gradle-release.log"
          exit "$status"

      - name: Verify story playback and community lists
        working-directory: ./android-app
        run: |
          set +e
          ./gradlew :app:testReleaseUnitTest --tests 'com.vladimir.messenger.ui.components.StoryPlaybackTest' --tests 'com.vladimir.messenger.ui.screens.groups.CommunityListTest' --tests 'com.vladimir.messenger.data.story.StoryPhotoPartsTest' --tests 'com.vladimir.messenger.data.swarm.OnlineHelperPolicyTest' --tests 'com.vladimir.messenger.data.swarm.SwarmContributionStatsTest' --no-daemon >> "$RUNNER_TEMP/gradle-build.log" 2>&1
          status=$?
          tail -100 "$RUNNER_TEMP/gradle-build.log"
          exit "$status"

      # Сырые логи Actions иногда недоступны через API/сеть. Оставляем хвост
      # тестов или компилятора как annotations, чтобы причина ошибки не терялась.
      - name: Expose Gradle failure tail
        if: failure()
        run: |
          test -f "$RUNNER_TEMP/gradle-release.log" || exit 0
          python3 - "$RUNNER_TEMP/gradle-release.log" <<'PY'
          from pathlib import Path
          import sys

          # Kotlin emits many warnings before test failures. Remove them and cap
          # the annotation below GitHub's 4 KiB message limit so the root cause survives.
          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()[-200:]
          lines = [line for line in lines if not line.startswith("w: ")]
          text = "\n".join(lines[-100:])
          if len(text) > 3500:
              text = "...[truncated]\n" + text[-3480:]
          escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle failure tail::{escaped}")
          PY

      # ---- подпись релиза -------------------------------------------------
      # Gradle подписывает APK прежним ключом android-app/app/p2p-release.jks.
      # Этот ключ лежит в ПУБЛИЧНОМ репозитории, поэтому подписать APK «как APU»
      # может кто угодно. Здесь подпись переделывается: новый ключ приходит из
      # секретов, а файл apu-signing-lineage (родословная подписи) говорит
      # Android, что новый ключ - законный преемник старого. Телефоны обновятся
      # без переустановки. Порядок и команды - docs/SIGNING_KEY_ROTATION.md.
      - name: Install build-tools (apksigner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" > /dev/null

      - name: Re-sign with the rotated release key
        env:
          APU_KS_B64: ${{ secrets.APU_RELEASE_KEYSTORE_B64 }}
          APU_KS_PASS: ${{ secrets.APU_RELEASE_KEYSTORE_PASSWORD }}
          APU_KS_ALIAS: ${{ secrets.APU_RELEASE_KEY_ALIAS }}
        run: |
          set -e
          APK_DIR=android-app/app/build/outputs/apk/release
          LINEAGE=android-app/app/apu-signing-lineage
          if [ -z "$APU_KS_B64" ]; then
            if [ -f "$LINEAGE" ]; then
              echo "::error::apu-signing-lineage is committed but the APU_RELEASE_* secrets are missing. An APK signed with the OLD key would be REJECTED as an update by phones that already rotated. Run scripts/rotate-signing-key.ps1 (it sets the secrets) and re-run this tag."
              exit 1
            fi
            echo "::warning::APU_RELEASE_* secrets are not set - this APK is signed with the OLD key from the public repository. See docs/SIGNING_KEY_ROTATION.md."
            exit 0
          fi
          if [ ! -f "$LINEAGE" ]; then
            echo "::error::Secrets are set but android-app/app/apu-signing-lineage is not committed. scripts/rotate-signing-key.ps1 creates it; commit it and re-run."
            exit 1
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "using $BT"
          echo "$APU_KS_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/apu-release.jks"
          # apksigner consumes each file password source once, so identical
          # keystore/key passwords still need separate files.
          printf '%s' "$APU_KS_PASS" > "$RUNNER_TEMP/apu-release-ks.pass"
          printf '%s' "$APU_KS_PASS" > "$RUNNER_TEMP/apu-release-key.pass"
          # Старый ключ первым: им подписываются v1/v2 для Android 8; новым -
          # v3 для Android 9+ (rotation-min-sdk-version 28), где и живёт
          # родословная. Старый ключ после этого обновлять приложение не может.
          "$BT/apksigner" sign \
            --ks android-app/app/p2p-release.jks --ks-pass pass:p2p2026release \
            --ks-key-alias p2p --key-pass pass:p2p2026release \
            --next-signer \
            --ks "$RUNNER_TEMP/apu-release.jks" --ks-pass "file:$RUNNER_TEMP/apu-release-ks.pass" \
            --ks-key-alias "$APU_KS_ALIAS" --key-pass "file:$RUNNER_TEMP/apu-release-key.pass" \
            --lineage "$LINEAGE" --rotation-min-sdk-version 28 \
            --v4-signing-enabled false \
            --out "$APK_DIR/app-release-rotated.apk" "$APK_DIR/app-release.apk"
          "$BT/apksigner" verify --verbose --print-certs "$APK_DIR/app-release-rotated.apk"
          mv -f "$APK_DIR/app-release-rotated.apk" "$APK_DIR/app-release.apk"
          rm -f "$RUNNER_TEMP/apu-release.jks" "$RUNNER_TEMP/apu-release-ks.pass" "$RUNNER_TEMP/apu-release-key.pass"
          echo "signed with the rotated key"

      # Контрольная сумма выпускается из того же файла, который затем
      # загружается в GitHub Release, поэтому пользователь может безопасно
      # проверить APK до ручной установки.
      - name: Create APK SHA-256 checksum
        run: |
          APK_DIR=android-app/app/build/outputs/apk/release
          (cd "$APK_DIR" && sha256sum app-release.apk > SHA256SUMS.txt)
          cat "$APK_DIR/SHA256SUMS.txt"

      # Upload the assembled, signed APK from this run (also for workflow_dispatch).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release.apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Create Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/SHA256SUMS.txt
          name: Release ${{ steps.get_version.outputs.VERSION }}
          # Вариант заметок уже одобрен владельцем по RELEASE_PUBLICATION_POLICY.md.
          # Сначала создаём скрытый prerelease-draft; после проверки APK и суммы
          # его отдельно промотируют в stable Latest.
          body_path: docs/RELEASE_NOTES_${{ steps.get_version.outputs.VERSION }}.md
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Если мост изменился (то есть менялся lib.udl), кладём его вместе с
      # собранным ядром обратно в main: иначе локальная сборка владельца и
      # песочница бота останутся со старым мостом (а старое ядро + новый мост
      # роняют приложение на старте по контрольным суммам). Только когда тег
      # стоит на вершине main - так делает бот. Релиз к этому моменту уже
      # опубликован, поэтому неудача здесь релиз не отменяет.
      - name: Push regenerated bindings and core back to main
        if: success() && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: |
          BIND=android-app/app/src/main/java/uniffi/p2p_core/p2p_core.kt
          if git diff --quiet -- "$BIND"; then
            echo "uniffi bindings unchanged - nothing to push"
            exit 0
          fi
          git fetch --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::warning::tag is not at the head of main - regenerated bindings were NOT pushed; take them from the core-bindings artifact of this run"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BIND" \
            android-app/app/src/main/jniLibs/arm64-v8a/libp2p_core.so \
            android-app/app/src/main/jniLibs/armeabi-v7a/libp2p_core.so
          git commit -m "ci: uniffi bindings + core rebuilt for ${GITHUB_REF#refs/tags/}"
          git push origin HEAD:main || echo "::warning::push to main failed - take the bindings from the core-bindings artifact of this run"
