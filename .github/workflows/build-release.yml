name: Build Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: Skip auto-build if Release already exists
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check_release.outputs.exists }}
    steps:
      - name: Check if Release already exists for the tag
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "${{ github.repository }}" --json name >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release '$TAG' already exists — skipping auto-build to preserve the manually published release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existing release for '$TAG' — will auto-build."
          fi

  build:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android NDK and export ANDROID_NDK_HOME
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Build native core from source (all ABIs)
        working-directory: ./rust-core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android-app/app/src/main/jniLibs build --release --features mqtt-dual-broker

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Sync versionName with tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Setting versionName to $VERSION"
          sed -i "s/versionName = .*/versionName = \"$VERSION\"/" android-app/app/build.gradle.kts
          grep -n "versionName" android-app/app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x ./android-app/gradlew

      - name: Build Release APK
        working-directory: ./android-app
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/release/app-release.apk
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## P2P Messenger ${{ steps.get_version.outputs.VERSION }}

            втоматическая сборка из тега.

            ### становка
            1. Скачайте app-release.apk
            2. азрешите установку из неизвестных источников
            3. становите
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
