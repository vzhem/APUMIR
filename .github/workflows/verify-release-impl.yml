name: Verify release implementation

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      tag:
        required: false
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test verification policy offline
        run: python3 scripts/release/test-verify-published-release.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" > /dev/null'

      - name: Verify APKs, signatures, checksums and published site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APU_RELEASE_TAG: ${{ inputs.tag }}
          APU_VERIFY_STAGE: ${{ inputs.stage }}
        run: |
          LOG="$RUNNER_TEMP/release-verification.log"
          if bash scripts/release/verify-published-release.sh > "$LOG" 2>&1; then
            cat "$LOG"
          else
            # The raw Actions log may be inaccessible to an API-only reviewer.
            # Preserve useful errors without exposing temporary signed URLs.
            python3 - "$LOG" <<'PY'
          from pathlib import Path
          import re, sys
          text = '\n'.join(Path(sys.argv[1]).read_text(errors='replace').splitlines()[-50:])
          text = re.sub(r'https?://[^\s]+', '<redacted-url>', text)[-6000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Release verification failed::{text}')
          PY
            exit 1
          fi
