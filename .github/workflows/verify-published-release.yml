name: Verify release assets and site

# Read-only verification; a draft is checked without publishing it. Once the
# same tag is public and the site has finished uploading, rerun the check.
on:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/verify-published-release.yml'
      - 'scripts/release/verify-published-release.sh'
      - 'scripts/release/test-verify-published-release.py'
      - 'docs/APP_DELIVERY_TRACKER.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (empty: nearest tag on this branch)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-publication]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test verification policy offline
        run: python3 scripts/release/test-verify-published-release.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" > /dev/null'

      - name: Verify APKs, signatures, checksums and published site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APU_RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/release/verify-published-release.sh
