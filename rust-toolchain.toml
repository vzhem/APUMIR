[toolchain]
# Одна версия компилятора для всего репозитория.
#
# Раньше CI ставил @stable, а stable за время проекта менялся минимум дважды:
# один и тот же коммит собирался разными компиляторами, и «воспроизвести
# релиз» было нельзя даже теоретически. Здесь версия закреплена; workflows
# (build-release, unit-tests, ci-core-check, sync-bindings) передают её же в
# dtolnay/rust-toolchain, чтобы андроидные target'ы ставились для неё.
#
# Обновлять сознательно, отдельным коммитом: поднять здесь и во всех четырёх
# workflow сразу, затем прогнать build-release целиком.
channel = "1.99.1"
